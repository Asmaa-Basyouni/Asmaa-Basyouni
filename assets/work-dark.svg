<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 354" width="860" role="img" aria-label="Six project cards: KM3NeT PhD at LPC Caen; GPU acceleration of SHYFEM-BFM; MEJ-ESS Monte Carlo simulator; neural surrogates for gas detectors; RPC neutron sensitivity with Geant4; charged multiplicity in pp collisions with PYTHIA8.">
